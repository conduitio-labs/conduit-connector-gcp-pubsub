name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          privateKey: ${{ secrets.GCP_PUBSUB_PRIVATE_KEY }}
          clientEmail: ${{ secrets.GCP_PUBSUB_CLIENT_EMAIL }}
          projectId: ${{ secrets.GCP_PUBSUB_PROJECT_ID }}
          subscriptionId: ${{ secrets.GCP_PUBSUB_SUBSCRIPTION_ID }}
          topicId: ${{ secrets.GCP_PUBSUB_TOPIC_ID }}
        run: make test GOTEST_FLAGS="-v -count=1"
